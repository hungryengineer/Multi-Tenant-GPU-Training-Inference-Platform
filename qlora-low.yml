apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: qlora-test-lp
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: team-a
    kueue.x-k8s.io/priority-class: low-priority
spec:
  entrypoint: "env OUTPUT_DIR=/app/output/lora-adapter uv run --frozen python /app/train_qlora.py"
  shutdownAfterJobFinishes: true
  rayClusterSpec:
    headGroupSpec:
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-head
              image: mt-gpu-training-ray:dev
              env:
                - name: OUTPUT_DIR
                  value: "/app/output/lora-adapter"
              volumeMounts:
                - mountPath: /app/output
                  name: checkpoint-vol
              resources:
                requests:
                  cpu: "1"
                limits:
                  cpu: "1"
          volumes:
            - name: checkpoint-vol
              persistentVolumeClaim:
                claimName: qlora-checkpoints

    workerGroupSpecs:
      - groupName: worker
        replicas: 2
        rayStartParams: {}
        template:
          spec:
            containers:
              - name: ray-worker
                image: mt-gpu-training-ray:dev
                imagePullPolicy: IfNotPresent
                env:
                  - name: OUTPUT_DIR
                    value: "/app/output/lora-adapter"
                volumeMounts:
                  - mountPath: /app/output
                    name: checkpoint-vol
                resources:
                  limits:
                    nvidia.com/gpu: "1"
            volumes:
              - name: checkpoint-vol
                persistentVolumeClaim:
                  claimName: qlora-checkpoints