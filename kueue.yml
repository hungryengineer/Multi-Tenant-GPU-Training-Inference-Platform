apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector:
    matchLabels:
      kueue-enabled: "true"
  resourceGroups:
  - coveredResources:
      - cpu
      - memory
      - nvidia.com/gpu
    flavors:
      - name: default-flavor
        resources:
          - name: cpu
            nominalQuota: "8"
          - name: memory
            nominalQuota: "8Gi"
          - name: nvidia.com/gpu
            nominalQuota: "3"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: team-a
  namespace: default
spec:
  clusterQueue: gpu-cluster-queue
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: team-b
  namespace: default
spec:
  clusterQueue: gpu-cluster-queue
